server {
    listen 80;
    listen [::]:80;
    server_name jocasta.tech www.jocasta.tech tenanttrust.ca www.tenanttrust.ca;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jocasta.tech www.jocasta.tech tenanttrust.ca www.tenanttrust.ca;

    ssl_certificate /etc/letsencrypt/live/jocasta.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jocasta.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/tenanttrust/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /\.ht {
        deny all;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
